[project]
name = "pi-eval-gradecli"
version = "0.1.0"
description = "Deterministic grading CLI over gradecore, packaged as a pi skill."
requires-python = ">=3.9"
dependencies = ["gradecore @ git+https://github.com/egnaro9/gradecore.git"]

[project.scripts]
gradecli = "gradecli:main"

[tool.setuptools]
py-modules = ["gradecli"]
package-dir = {"" = "skills/grade/scripts"}
